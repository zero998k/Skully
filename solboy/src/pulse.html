<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="__MASCOT__">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolBoy Pulse</title>
<style>
:root {
  --bg: #050505; --panel: #0b0b0c; --panel-2: #121214; --edge: #1f1f23; --edge-2: #2c2c32;
  --ink: #f4f4f5; --ink-2: #b4b4bb; --ink-3: #75757e; --accent: #ff2d95; --up: #16c784; --down: #ff4d5e;
  --sun: #ffd23f; --sky: #5ce1ff; --grape: #a78bfa;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.35 var(--body); }
body { overflow: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--edge-2); border-radius: 8px; padding: 7px 9px; }
input:focus, select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
.mono { font-family: var(--mono); }
.up { color: var(--up); } .down { color: var(--down); } .dim { color: var(--ink-3); } .warn { color: var(--sun); }

/* top bar */
.top { height: 52px; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--edge); background: #070708; }
@font-face { font-family: 'SolBoyLogo'; src: url(data:font/woff2;base64,__LOGO_FONT__) format('woff2'); font-weight: 800; font-display: block; }
.logo { display: flex; align-items: center; gap: 8px; font-family: 'SolBoyLogo', var(--body); font-weight: 800; font-size: 21px; letter-spacing: .3px; text-shadow: 2px 2px 0 #000; }
.logo b { color: var(--accent); font-weight: 800; text-shadow: 2px 2px 0 #000, 0 0 14px rgba(255,45,149,.8); }
.logo img { width: 44px; height: 44px; object-fit: contain; margin: -6px 0; filter: drop-shadow(0 0 10px rgba(255,45,149,.45)); }
.logo .sub { font-family: var(--body); font-size: 14px; color: var(--ink-3); text-shadow: none; font-weight: 600; }
.nav a { color: var(--ink-2); font-weight: 600; padding: 6px 10px; border-radius: 8px; } .nav a:hover { color: var(--ink); background: var(--panel-2); } .nav a.on { color: #fff; background: var(--accent); }
.spacer { flex: 1; }
.chip { font: 600 12px var(--mono); padding: 4px 9px; border-radius: 999px; border: 1px solid var(--edge-2); color: var(--ink-2); white-space: nowrap; }
.chip.live { color: var(--up); border-color: rgba(22,199,132,.4); } .chip.off { color: var(--down); border-color: rgba(255,77,94,.4); }
.chip.paper { color: #0a0a0a; background: var(--sun); border-color: #000; } .chip.real { color: #fff; background: var(--accent); border-color: #000; }
.icon-btn { background: var(--panel-2); border: 1px solid var(--edge-2); border-radius: 8px; padding: 6px 10px; font-weight: 600; }
.icon-btn:hover { border-color: var(--ink-3); }
.btn { background: var(--panel-2); border: 1px solid var(--edge-2); border-radius: 8px; padding: 8px 14px; font-weight: 700; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.buy { background: var(--up); border-color: var(--up); color: #04140d; } .btn.sell { background: var(--down); border-color: var(--down); color: #fff; }
.btn:disabled { opacity: .5; cursor: wait; }

/* board */
body { display: flex; flex-direction: column; }
.top { flex: none; }
main { flex: 1; min-height: 0; } /* everything below the top bar; each panel inside scrolls on its own */
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); height: 100%; }
.col { display: flex; flex-direction: column; border-right: 1px solid var(--edge); min-width: 0; min-height: 0; overflow: hidden; }
.col:last-child { border-right: 0; }
.col-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 2px solid var(--accent); background: var(--panel); flex-wrap: wrap; }
.col-head h2 { margin: 0; font-size: 15px; font-weight: 800; flex: 1; white-space: nowrap; }
.col-head .count { color: var(--accent); font: 700 12px var(--mono); }
.col-head input.q { width: 120px; padding: 5px 8px; font-size: 12px; }
.col-head .qb { display: flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--edge-2); border-radius: 8px; padding: 0 6px; }
.col-head .qb input { width: 52px; border: 0; padding: 5px 2px; background: transparent; font: 12px var(--mono); }
.paused-tag { font: 700 10px var(--mono); color: var(--sun); border: 1px solid rgba(255,210,63,.5); padding: 2px 6px; border-radius: 6px; }
.icon-btn.qual.on { color: #fff; background: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px rgba(255,45,149,.35); }
.filters-dot { position: relative; } .filters-dot.on::after { content: ''; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.list { overflow-y: auto; flex: 1; min-height: 0; overscroll-behavior: contain; }
.empty { color: var(--ink-3); padding: 30px 16px; text-align: center; line-height: 1.6; }

.card { display: grid; grid-template-columns: 72px 1fr auto; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--edge); cursor: pointer; position: relative; }
.card:hover { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--accent); }
.card.enter { animation: enter .45s cubic-bezier(.2,.8,.2,1); }
@keyframes enter { 0% { opacity: 0; transform: translateY(-16px) scale(.98); background: rgba(255,45,149,.18); } 60% { opacity: 1; } 100% { background: transparent; } }
.card { will-change: transform; }
@keyframes flash { from { background: rgba(255,45,149,.16); } to { background: transparent; } }
.pic { width: 72px; height: 72px; border-radius: 10px; background: var(--panel-2) center/cover no-repeat; border: 2px solid var(--edge-2); position: relative; display: grid; place-items: center; font-weight: 900; font-size: 22px; color: var(--ink-3); }
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 8px; opacity: 0; transition: opacity .2s; } .pic img.ok { opacity: 1; }
.pic .proto { z-index: 1;  position: absolute; right: -5px; bottom: -5px; font: 700 9px var(--mono); padding: 2px 4px; border-radius: 6px; background: #000; border: 1px solid var(--edge-2); color: var(--sun); }
.pic .ring { position: absolute; inset: -2px; border-radius: 10px; border: 2px solid transparent; }
.ca { font: 10px var(--mono); color: var(--ink-3); text-align: center; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 72px; }
.mid { min-width: 0; display: grid; gap: 4px; align-content: start; }
.name { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.name b { font-size: 15px; white-space: nowrap; }
.name span { color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.copy { color: var(--ink-3); font-size: 11px; background: none; border: 0; padding: 0 2px; }
.meta { display: flex; align-items: center; gap: 9px; color: var(--ink-2); font: 12px var(--mono); flex-wrap: wrap; }
.meta .age { color: var(--up); font-weight: 700; }
.soc a { color: var(--ink-2); font-size: 12px; } .soc a:hover { color: var(--ink); }
.handle { color: var(--grape); font: 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcts { display: flex; gap: 8px; flex-wrap: wrap; font: 11px var(--mono); }
.pct { display: inline-flex; gap: 3px; align-items: center; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--edge-2); }
.pct.good { color: var(--up); } .pct.bad { color: var(--down); border-color: rgba(255,77,94,.35); } .pct.na { color: var(--ink-3); }
.right { display: grid; justify-items: end; align-content: start; gap: 3px; font: 12px var(--mono); }
.right .v, .right .mc { white-space: nowrap; } .right .mc b { color: var(--accent); font-size: 14px; } .right .v b { color: var(--ink); }
.bsbar { width: 70px; height: 3px; background: var(--down); border-radius: 2px; overflow: hidden; } .bsbar i { display: block; height: 100%; background: var(--up); }
.qbtn { margin-top: 4px; background: var(--accent); border: 0; color: #fff; font: 700 12px var(--mono); padding: 5px 10px; border-radius: 999px; box-shadow: 0 0 12px rgba(255,45,149,.35); }
.qbtn:hover { filter: brightness(1.12); }
.prog { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); }

/* filters modal */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: grid; place-items: center; z-index: 50; }
.modal { width: min(560px, 96vw); max-height: 92vh; background: var(--panel); border: 1px solid var(--edge-2); border-radius: 16px; display: flex; flex-direction: column; }
.modal header { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--edge); }
.modal header h3 { margin: 0; flex: 1; font-size: 16px; }
.presets button { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--edge-2); background: var(--bg); font: 700 11px var(--mono); color: var(--ink-3); }
.presets button.on { color: #fff; background: var(--accent); border-color: var(--accent); }
.modal .body { overflow-y: auto; min-height: 0; flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.modal .body > * { flex-shrink: 0; } /* sections keep their full height and the window scrolls, instead of sections being cut off */
.modal header, .modal footer { flex: none; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { background: none; border: 0; padding: 7px 11px; border-radius: 8px; color: var(--ink-2); font-weight: 600; }
.tabs button.on { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.tabs button .n { display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 4px; margin-left: 5px; border-radius: 9px; background: var(--accent); color: #fff; font: 700 10px var(--mono); }
.box { background: var(--bg); border: 1px solid var(--edge); border-radius: 12px; padding: 12px; display: grid; gap: 12px; }
.box label.f { display: grid; gap: 6px; color: var(--ink-2); font-size: 12px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pair input, .pair4 input, .pair4 select, .pair .kw { width: 100%; min-width: 0; }
.box { min-width: 0; overflow: hidden; }
.pair4 { display: grid; grid-template-columns: 1fr 70px 1fr 70px; gap: 8px; }
.kw { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--bg); border: 1px solid var(--edge-2); border-radius: 8px; padding: 4px 6px; min-height: 36px; }
.kw input { border: 0; flex: 1; min-width: 90px; padding: 4px; }
.kw span { background: var(--panel-2); border: 1px solid var(--edge-2); border-radius: 6px; padding: 2px 6px; font-size: 12px; }
.kw span button { background: none; border: 0; color: var(--ink-3); padding: 0 0 0 4px; }
.toggles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.tog { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--edge-2); border-radius: 8px; color: var(--ink-2); user-select: none; cursor: pointer; }
.tog input { accent-color: var(--accent); width: 15px; height: 15px; }
.tog.off { opacity: .45; cursor: not-allowed; }
.tog small { color: var(--ink-3); margin-left: auto; font-size: 10px; }
.modal footer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--edge); align-items: center; }
.note { color: var(--ink-3); font-size: 12px; line-height: 1.5; }

/* coin view */
.coin { display: grid; grid-template-columns: minmax(0, 1fr) 330px; grid-template-rows: minmax(0, 1fr); height: 100%; }
.coin-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--edge); overflow: hidden; }
.coin-head { display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-bottom: 1px solid var(--edge); flex-wrap: wrap; }
.coin-head .pic { width: 44px; height: 44px; font-size: 16px; }
.coin-head .title b { font-size: 17px; } .coin-head .title { display: grid; gap: 2px; }
.stat { display: grid; gap: 1px; } .stat small { color: var(--ink-3); font-size: 11px; } .stat b { font: 600 13px var(--mono); }
.stat.big b { font-size: 20px; color: var(--accent); }
.chart-bar { display: flex; gap: 6px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--edge); font: 12px var(--mono); }
.chart-bar button { background: none; border: 0; color: var(--ink-3); padding: 4px 7px; border-radius: 6px; }
.chart-bar button.on { color: #fff; background: var(--accent); }
#chart { height: 44%; min-height: 220px; flex: none; position: relative; }
.chart-msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); pointer-events: none; }
.coin-tabs { display: flex; gap: 4px; padding: 6px 10px; border-bottom: 1px solid var(--edge); border-top: 1px solid var(--edge); align-items: center; flex-wrap: wrap; }
.coin-tabs button { background: none; border: 0; padding: 6px 10px; color: var(--ink-2); font-weight: 600; border-radius: 6px; }
.coin-tabs button.on { color: #fff; background: var(--accent); }
.coin-tabs .sub { margin-left: auto; display: flex; gap: 4px; }
.coin-tabs .sub button { font-size: 12px; padding: 4px 8px; }
.table-wrap { overflow: auto; flex: 1; min-height: 0; overscroll-behavior: contain; }
table { width: 100%; border-collapse: collapse; font: 12px var(--mono); }
th { position: sticky; top: 0; background: var(--panel); color: var(--ink-3); font-weight: 500; text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--edge); }
td { padding: 6px 10px; border-bottom: 1px solid #141417; white-space: nowrap; }
tr.new td { animation: flash .9s ease-out; } tr.new.buy td { animation: tickUp 1s ease-out; } tr.new.sell td { animation: tickDown 1s ease-out; }
.tag { display: inline-block; font: 700 9px var(--mono); padding: 1px 5px; border-radius: 5px; margin-left: 4px; border: 1px solid; }
.tag.dev { color: var(--sun); } .tag.sniper { color: var(--down); } .tag.bundler { color: var(--grape); } .tag.kol { color: var(--sky); } .tag.insider { color: #fb923c; } .tag.cluster { color: #f472b6; } .tag.pool { color: var(--ink-3); } .tag.you { color: var(--up); }
.bar { height: 4px; background: var(--edge); border-radius: 2px; width: 90px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--accent); }

.side { overflow-y: auto; min-height: 0; overscroll-behavior: contain; padding: 12px; display: grid; gap: 12px; align-content: start; background: var(--panel); }
.panel { background: var(--bg); border: 1px solid var(--edge); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.panel h4 { margin: 0; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.info { border: 1px solid var(--edge); border-radius: 10px; padding: 8px 4px; text-align: center; }
.info b { display: block; font: 700 14px var(--mono); } .info small { color: var(--ink-3); font-size: 10px; }

/* trade box (side panel and floating) */
.trade .bs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.trade .bs button { padding: 8px; border-radius: 8px; border: 1px solid var(--edge-2); background: var(--panel-2); font-weight: 800; color: var(--ink-2); }
.trade .bs button.on.b { background: var(--up); color: #04140d; border-color: var(--up); } .trade .bs button.on.s { background: var(--down); color: #fff; border-color: var(--down); }
.amts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.amts button { background: var(--panel-2); border: 1px solid var(--edge-2); border-radius: 8px; padding: 7px 4px; font: 600 12px var(--mono); }
.amts button.on { border-color: var(--accent); color: var(--ink); }
.trade .row { display: flex; gap: 8px; align-items: center; } .trade .row input { flex: 1; min-width: 0; }
.trade .go { width: 100%; padding: 11px; font-size: 14px; }
.pos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; font: 12px var(--mono); }
.pos small { display: block; color: var(--ink-3); font: 10px var(--body); }
.floating .grip { color: var(--ink-3); letter-spacing: -1px; }
.floating { position: fixed; width: 360px; z-index: 40; background: var(--panel); border: 1px solid var(--accent); border-radius: 14px; box-shadow: 0 18px 50px rgba(0,0,0,.6); }
.floating .drag { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--edge); cursor: move; user-select: none; }
.floating .drag b { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.floating .drag button { background: none; border: 0; color: var(--ink-3); padding: 2px 4px; font-size: 14px; }
.floating .trade { padding: 12px; display: grid; gap: 10px; }
body.quick-mode .top, body.quick-mode main { display: none; }
body.quick-mode .floating { position: static; width: auto; border-radius: 0; border: 0; box-shadow: none; }

.toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 60; }
.toast { background: var(--panel-2); border: 1px solid var(--edge-2); border-left: 3px solid var(--sky); border-radius: 10px; padding: 10px 12px; max-width: 340px; font-size: 13px; animation: in .2s ease-out; }
.toast.win { border-left-color: var(--up); } .toast.loss { border-left-color: var(--down); }
@keyframes in { from { transform: translateY(8px); opacity: 0; } }
/* ---------- polish ---------- */
::selection { background: rgba(255,45,149,.35); color: #fff; }
* { scrollbar-width: thin; scrollbar-color: var(--edge-2) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--edge-2); border-radius: 8px; border: 2px solid var(--bg); } ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
.mono, table, .meta, .right, .pcts, .chip, .stat b, .info b, .pos, .amts button { font-variant-numeric: tabular-nums; }
button, .card, .nav a, .tog, input, select { transition: background-color .15s, border-color .15s, color .15s, box-shadow .15s, transform .08s, filter .15s; }
button:active:not(:disabled) { transform: scale(.97); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input:focus, select:focus { box-shadow: 0 0 0 3px rgba(255,45,149,.18); }
input::placeholder { color: var(--ink-3); }
.top { box-shadow: 0 1px 0 rgba(255,45,149,.12), 0 8px 24px rgba(0,0,0,.5); position: relative; z-index: 5; }
.logo:hover img { transform: rotate(-6deg) scale(1.06); } .logo img { transition: transform .2s; }
.chip .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; box-shadow: 0 0 0 0 currentColor; animation: beat 1.6s infinite; }
@keyframes beat { 0% { box-shadow: 0 0 0 0 rgba(22,199,132,.7); } 70% { box-shadow: 0 0 0 6px rgba(22,199,132,0); } 100% { box-shadow: 0 0 0 0 rgba(22,199,132,0); } }
.btn:hover:not(:disabled) { filter: brightness(1.1); } .btn.primary { box-shadow: 0 0 16px rgba(255,45,149,.35); }
kbd { font: 600 10px var(--mono); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--edge-2); border-bottom-width: 2px; color: var(--ink-2); background: var(--panel-2); }
.btn kbd { background: rgba(0,0,0,.25); border-color: rgba(0,0,0,.35); color: inherit; margin-left: 4px; }
/* columns */
.col-head { background: linear-gradient(180deg, #101012, var(--panel)); }
.col-head h2 { display: flex; align-items: center; gap: 8px; letter-spacing: .2px; }
.cdot { width: 8px; height: 8px; border-radius: 50%; flex: none; } .cdot.new { background: var(--up); box-shadow: 0 0 8px var(--up); } .cdot.stretch { background: var(--sun); box-shadow: 0 0 8px var(--sun); } .cdot.migrated { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.col-head .count { background: rgba(255,45,149,.12); padding: 1px 7px; border-radius: 999px; }
.col.is-paused .col-head { border-bottom-color: var(--sun); }
/* cards */
.card:hover .pic { transform: scale(1.04); } .pic { transition: transform .15s; }
.picw { position: relative; isolation: isolate; }
.picw[style*="--p"] .pic::before { content: ''; position: absolute; inset: -4px; border-radius: 13px; background: conic-gradient(var(--ring, var(--accent)) calc(var(--p) * 1%), #1a1a1e 0); z-index: -1; }
.picw.hot { --ring: var(--sun); }
.meta .age.old { color: var(--ink-2); font-weight: 600; }
.right .mc b { display: inline-block; border-radius: 4px; padding: 0 2px; }
.tick-up { animation: tickUp .9s ease-out; } .tick-down { animation: tickDown .9s ease-out; }
@keyframes tickUp { from { background: rgba(22,199,132,.35); color: #fff; } }
@keyframes tickDown { from { background: rgba(255,77,94,.35); color: #fff; } }
.copy:hover { color: var(--accent); } .copy.done { color: var(--up); }
.qbtn:hover { box-shadow: 0 0 18px rgba(255,45,149,.6); }
.skel { display: grid; grid-template-columns: 72px 1fr 60px; gap: 10px; padding: 12px; border-bottom: 1px solid var(--edge); }
.skel i { display: block; border-radius: 8px; background: linear-gradient(90deg, #111114 25%, #1b1b20 50%, #111114 75%); background-size: 300% 100%; animation: shimmer 1.4s infinite linear; }
.skel .a { height: 72px; } .skel .b { height: 12px; margin: 6px 0; } .skel .b.s { width: 60%; } .skel .c { height: 12px; margin-top: 6px; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -50% 0; } }
.empty .big { display: block; font-size: 26px; margin-bottom: 6px; opacity: .8; }

<body>

  <a class="logo" href="/"><img src="__MASCOT__" alt="SolBoy"><span>SOL<b>BOY</b></span><span class="sub">Pulse</span></a>

  <span class="spacer"></span>
  <span class="chip" id="feedChip" title="Coins SolBoy is tracking, and trades arriving from the live feed in the last minute">connecting</span>
  <span class="chip" id="delayChip" title="How far behind the blockchain the live feed is, measured on your connection">delay …</span>
  <span class="chip" id="solChip">SOL $-</span>
  <span class="chip" id="modeChip">-</span>
  <button class="icon-btn" id="prefsBtn" title="Quick buy amounts and KOL wallets">⚙</button>
  <button class="btn primary" id="quickBtn" title="Show the floating quick trade box (press Q)">⚡ Quick trade <kbd>Q</kbd></button>
</header>
<main>
  <section class="board" id="board">
    <div class="col" data-col="new"></div>
    <div class="col" data-col="stretch"></div>
    <div class="col" data-col="migrated"></div>
  </section>
  <section class="coin" id="coin" hidden></section>
</main>

<div class="modal-bg" id="filterModal" hidden></div>
<div class="modal-bg" id="prefsModal" hidden></div>
<div class="floating" id="floating" hidden></div>
<div class="peek" id="peek" hidden></div>
<div class="toasts" id="toasts"></div>

<script>/*__CHART_LIB__*/</script>
<script>
const TOKEN = '__TOKEN__';
const SERVER_MODE = '__SERVER_MODE__' === 'true';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const store = { get(k, d) { try { const v = localStorage.getItem(`pulse.${k}`); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(`pulse.${k}`, JSON.stringify(v)); } catch {} } };
const COLS = { new: 'New Pairs', stretch: 'Final Stretch', migrated: 'Migrated' };

async function api(path, body) {
  const res = await fetch(`${path}${path.includes('?') ? '&' : '?'}t=${TOKEN}`, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  if (res.status === 401 && SERVER_MODE) { location.href = '/login'; throw new Error('Log in first.'); }
  if (res.status === 403) { location.reload(); throw new Error('reloading'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `error ${res.status}`);
  return data;
}
function toast(kind, text) {
  const t = document.createElement('div'); t.className = `toast ${kind}`;
  t.innerHTML = `<span class="ic">${kind === 'win' ? '✅' : kind === 'loss' ? '⚠️' : '💬'}</span><span></span>`; t.lastChild.textContent = text;
  const bye = () => { t.classList.add('bye'); setTimeout(() => t.remove(), 200); };
  t.onclick = bye; $('toasts').prepend(t);
  while ($('toasts').children.length > 4) $('toasts').lastChild.remove();
  setTimeout(bye, 5000);
}
const money = (n) => n == null ? '-' : n >= 1e9 ? `$${(n / 1e9).toFixed(2)}B` : n >= 1e6 ? `$${(n / 1e6).toFixed(2)}M` : n >= 1e3 ? `$${(n / 1e3).toFixed(n >= 1e5 ? 0 : 1)}K` : `$${n.toFixed(n < 10 ? 2 : 0)}`;
const pctf = (n) => n == null ? '-' : `${n < 10 ? n.toFixed(1) : Math.round(n)}%`;
const sol = (n) => n == null ? '-' : `${n >= 100 ? n.toFixed(0) : n >= 1 ? n.toFixed(2) : n.toFixed(3)}`;
const ageOf = (s) => s == null ? '-' : s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m` : s < 86400 ? `${Math.floor(s / 3600)}h` : `${Math.floor(s / 86400)}d`;
const ago = (t) => ageOf(Math.max(0, Math.round((Date.now() - t) / 1000)));
const short = (a) => a ? `${a.slice(0, 4)}…${a.slice(-4)}` : '-';
// coin pictures come through SolBoy, which caches them from the fastest IPFS gateway; the initials show until then
// if SolBoy can't fetch a picture, the browser tries the coin's own link once before showing the initials
const picImg = (r) => r.image ? `<img data-key="${esc(r.mint)}" src="/api/pulse/img?mint=${encodeURIComponent(r.mint)}&t=${TOKEN}" data-alt="${/^https:\/\//.test(r.image) ? esc(r.image) : ''}" alt="" decoding="async" onload="this.classList.add('ok')" onerror="if(this.dataset.alt){this.src=this.dataset.alt;this.dataset.alt=''}else this.remove()">` : '';
/* Smooth updates: change only the parts of the page that really changed, so nothing blinks, jumps or loses focus. */
function morph(from, to) {
  if (from.nodeType !== to.nodeType || from.nodeName !== to.nodeName) return void from.replaceWith(to.cloneNode(true));
  if (from.nodeType === 3 || from.nodeType === 8) { if (from.data !== to.data) from.data = to.data; return; }
  if (from.nodeType !== 1) return;
  if (from.tagName === 'IMG' && (from.getAttribute('src') === to.getAttribute('src') || (from.dataset.key && from.dataset.key === to.dataset.key))) return; // keep a loaded picture
  const focused = from === document.activeElement;
  for (const a of [...from.attributes]) if (!to.hasAttribute(a.name) && !(a.name === 'class' && from.dataset.keepClass)) from.removeAttribute(a.name);
  for (const a of to.attributes) if (from.getAttribute(a.name) !== a.value && !(focused && a.name === 'value')) from.setAttribute(a.name, a.value);
  if ((from.tagName === 'INPUT' || from.tagName === 'TEXTAREA') && !focused && from.value !== (to.getAttribute('value') ?? '')) from.value = to.getAttribute('value') ?? '';
  morphKids(from, to);
}
function morphKids(from, to) {
  const fc = [...from.childNodes], tc = [...to.childNodes];
  tc.forEach((n, i) => (i < fc.length ? morph(fc[i], n) : from.appendChild(n.cloneNode(true))));
  for (let i = tc.length; i < fc.length; i++) fc[i].remove();
}
function setHTML(el, html) {
  if (!el || el._h === html) return;
  el._h = html;
  if (!el.firstChild) { el.innerHTML = html; return; }
  const t = document.createElement(el.tagName === 'TBODY' ? 'tbody' : 'div'); t.innerHTML = html;
  morphKids(el, t);
}
const htmlNode = (html) => { const t = document.createElement('div'); t.innerHTML = html.trim(); return t.firstChild; };
// one line of "what is this": the X post it came from, or the creator's description
const storyLine = (r) => r.tweet?.text ? `<div class="story"><span class="xb">𝕏</span><b>@${esc(r.tweet.handle)}</b>${r.tweet.verified ? '<i class="vf">✓</i>' : ''} ${esc(r.tweet.text)}</div>`
  : r.description ? `<div class="story">${esc(r.description)}</div>` : r.xKind === 'community' ? '<div class="story dim">𝕏 community</div>' : '';
const PROTO_SHORT = { pump: 'PUMP', bonk: 'BONK', 'pump-amm': 'P·AMM', raydium: 'RAY', meteora: 'MET', 'meteora-v2': 'MET2', orca: 'ORCA' };

let STATUS = {}, MODE = 'paper', CFG = { quickBuy: [0.05, 0.1, 0.5, 1], quickSell: [25, 50, 100], kols: [] }, FILTERS = null, PROTOCOLS = [];
function renderStatus() {
  const f = STATUS.feed;
  $('feedChip').className = `chip ${f === 'live' ? 'live' : f === 'connecting' ? '' : 'off'}`;
  $('feedChip').innerHTML = f === 'live' ? `<span class="dot"></span>LIVE · ${STATUS.tracking ?? 0} coins · ${STATUS.tpm ?? 0} trades/min` : f === 'quiet' ? 'feed quiet' : f === 'connecting' ? 'connecting…' : 'feed offline';
  $('solChip').textContent = `SOL ${STATUS.solUsd ? '$' + STATUS.solUsd.toFixed(2) : '$-'}`;
  const dl = STATUS.delaySec;
  $('delayChip').textContent = dl == null ? 'delay: measuring…' : `⏱ ${dl < 1 ? Math.round(dl * 1000) + 'ms' : dl.toFixed(1) + 's'} behind chain`;
  $('delayChip').className = `chip ${dl == null ? '' : dl < 1.5 ? 'live' : 'off'}`;
  $('modeChip').className = `chip ${MODE === 'live' ? 'real' : 'paper'}`;
  $('modeChip').textContent = MODE === 'live' ? 'REAL MONEY' : 'PAPER';
}

/* ---------- board ---------- */
const BOARD = { new: [], stretch: [], migrated: [] };
const paused = {};
const seen = new Set();
const quick = { new: store.get('qb.new', 0.1), stretch: store.get('qb.stretch', 0.1), migrated: store.get('qb.migrated', 0.1) };
const search = { new: '', stretch: '', migrated: '' };
function colHead(c) {
  return `<div class="col-head"><h2><i class="cdot ${c}"></i>${COLS[c]} <span class="count" id="cnt-${c}"></span></h2>

/* chart: candles built from live trades (market cap or price, in USD) */
function makeChart() {
  if (typeof LightweightCharts === 'undefined') { $('chartMsg').textContent = 'Chart unavailable'; return; }
  chart = LightweightCharts.createChart($('chart'), { autoSize: true, layout: { background: { color: '#050505' }, textColor: '#9a9aa2', fontFamily: 'ui-monospace, Menlo, monospace' }, grid: { vertLines: { color: '#111114' }, horzLines: { color: '#111114' } }, timeScale: { timeVisible: true, secondsVisible: true, borderColor: '#1f1f23' }, rightPriceScale: { borderColor: '#1f1f23' }, crosshair: { mode: 0 } });
  series = chart.addCandlestickSeries({ upColor: '#16c784', downColor: '#ff4d5e', borderVisible: false, wickUpColor: '#16c784', wickDownColor: '#ff4d5e', priceFormat: { type: 'custom', formatter: (v) => chartMode === 'mc' ? money(v) : v.toPrecision(4) } });
  volSeries = chart.addHistogramSeries({ priceScaleId: 'vol', priceFormat: { type: 'volume' }, color: '#2a2a33', lastValueVisible: false, priceLineVisible: false });
  chart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
}
let candles = [];
const valueOfTrade = (t) => t.mcUsd == null ? null : chartMode === 'mc' ? t.mcUsd : t.mcUsd / 1e9;
function drawChart() {
  if (!series || !COIN) return;
  candles = [];
  if (extCandles.length) {
    const k = chartMode === 'mc' ? 1e9 : 1;
    for (const c of extCandles) candles.push({ time: Math.floor(c.t / 1000), open: c.o * k, high: c.h * k, low: c.l * k, close: c.c * k, volume: c.v });
  }
  for (const t of [...COIN.trades].reverse()) addToChart(t, false);
  drawnTrades = COIN.trades.length;
  const first = candles[0]?.time ?? 0, step = extCandles.length && interval < 60 ? 60 : interval;
  markers = [...COIN.trades].reverse().map((t) => markerFor(t, step)).filter((m) => m && m.time >= first);
  applyMarkers();
  series.setData(candles.map(({ volume, ...c }) => c));
  volSeries.setData(candles.map((c) => ({ time: c.time, value: c.volume ?? 0, color: c.close >= c.open ? 'rgba(22,199,132,.35)' : 'rgba(255,77,94,.35)' })));
  $('chartMsg').hidden = candles.length > 0;
  chart.timeScale().scrollToRealTime();
}
/* trade markers on the chart, like Axiom: dev, snipers / bundlers, KOLs and whales */
let markers = [];
let showMarkers = store.get('markers', true);
function markerFor(t, step) {
  const tags = t.tags ?? [], buy = t.side === 'buy';
  let text = null, color = buy ? '#16c784' : '#ff4d5e';
  if (tags.includes('dev')) { text = buy ? 'DB' : 'DS'; color = '#ffd23f'; }
  else if (t.kol) { text = buy ? 'KB' : 'KS'; color = '#5ce1ff'; }
  else if (tags.includes('sniper') || tags.includes('bundler')) text = buy ? 'SB' : 'SS';
  else if (t.sol >= 5) text = '🐳';
  if (!text) return null;
  return { time: Math.floor(t.t / 1000 / step) * step, position: buy ? 'belowBar' : 'aboveBar', color, shape: 'circle', text };
}
function applyMarkers() {
  if (!series) return;
  markers.sort((a, b) => a.time - b.time);
  series.setMarkers(showMarkers ? markers.slice(-150) : []);
}
function addToChart(t, live = true) {
  const v = valueOfTrade(t); if (v == null || !series) return;
  const step = extCandles.length && interval < 60 ? 60 : interval;
  const time = Math.floor(t.t / 1000 / step) * step;
  let last = candles.at(-1);
  if (last && time < last.time) return;
  if (!last || time > last.time) { last = { time, open: last ? last.close : v, high: v, low: v, close: v, volume: 0 }; candles.push(last); }
  last.high = Math.max(last.high, v); last.low = Math.min(last.low, v); last.close = v; last.volume += t.usd ?? 0;
  if (live) { const mk = markerFor(t, step); if (mk) { markers.push(mk); applyMarkers(); } }
  if (live) { series.update({ time: last.time, open: last.open, high: last.high, low: last.low, close: last.close }); volSeries.update({ time: last.time, value: last.volume, color: last.close >= last.open ? 'rgba(22,199,132,.35)' : 'rgba(255,77,94,.35)' }); $('chartMsg').hidden = true; }
}

      <label class="f box">Quick buy amounts (SOL, comma separated)<input id="pBuy" value="${esc(CFG.quickBuy.join(', '))}"></label>
      <label class="f box">Quick sell amounts (% of your coins)<input id="pSell" value="${esc(CFG.quickSell.join(', '))}"></label>
      <label class="f box">KOL / tracked wallets: one per line, address then a name. They get a KOL tag in trades and holders.<textarea id="pKols" rows="7" style="font:12px var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--edge-2);border-radius:8px;padding:8px">${esc(CFG.kols.map((k) => `${k.address} ${k.label}`).join('\n'))}</textarea></label>
      <div class="note">Your copied wallets are tagged automatically. Take profit and stop loss (Dashboard → Loadout) also apply to coins you buy here.</div>
      <div class="box"><div style="display:flex;align-items:center;gap:8px"><b style="flex:1">📡 Live data check</b><button class="btn" id="pHealth">Check now</button></div>
        <div class="note">Tests every source Pulse uses (live feed, Pump.fun, pictures, X posts, charts, prices, AI) from this computer, on real coins.</div><div id="healthOut"></div></div>
    </div><footer><span style="flex:1"></span><button class="btn primary" id="pSave">Save</button></footer></div>`;
};
$('prefsModal').addEventListener('click', async (e) => {
  if (e.target === $('prefsModal') || e.target.id === 'pClose') { $('prefsModal').hidden = true; return; }
  if (e.target.id === 'whyGo' || e.target.dataset.whyopen !== undefined) {
    const mint = ($('whyIn').value || '').trim();
    if (!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(mint)) { $('whyOut').innerHTML = '<div class="note down">That isn\'t a coin address.</div>'; return; }
    $('whyOut').innerHTML = '<div class="note">Checking…</div>';
    try { $('whyOut').innerHTML = whyHtml(mint, await api(`/api/pulse/why?mint=${mint}`)); } catch (err) { $('whyOut').innerHTML = `<div class="note down">${esc(err.message)}</div>`; }
    return;
  }
  if (e.target.id === 'pHealth') {
    e.target.disabled = true; e.target.textContent = 'Checking…'; $('healthOut').innerHTML = '<div class="note">Checking (up to 10 seconds)…</div>';
    try {
      const { checks } = await api('/api/pulse/health');
      $('healthOut').innerHTML = `<div class="health">${checks.map((c) => `<div class="hc ${c.ok ? 'ok' : 'bad'}"><b>${c.ok ? '✓' : '✗'} ${esc(c.name)}</b><span>${esc(c.detail)}${c.ms != null ? ` · ${(c.ms / 1000).toFixed(1)}s` : ''}</span></div>`).join('')}</div>
        <div class="note">${checks.every((c) => c.ok) ? 'Everything is working on real coins.' : 'Anything with ✗ isn\'t reaching SolBoy from this computer. Screenshot this and send it over.'}</div>`;
    } catch (err) { $('healthOut').innerHTML = `<div class="note down">${esc(err.message)}</div>`; }
    e.target.disabled = false; e.target.textContent = 'Check again';
    return;
  }
  if (e.target.id === 'pSave') {
    const nums = (s) => s.split(/[,\s]+/).map(Number).filter((n) => n > 0);
    const kols = $('pKols').value.split('\n').map((l) => l.trim()).filter(Boolean).map((l) => { const [address, ...name] = l.split(/\s+/); return { address, label: name.join(' ') }; });
    try { const r = await api('/api/pulse/prefs', { quickBuy: nums($('pBuy').value), quickSell: nums($('pSell').value), kols, stretchPct: Number($('pStretch').value) }); Object.assign(CFG, r); $('prefsModal').hidden = true; toast('win', 'Saved'); rerenderTradeBoxes(); }
    catch (err) { toast('loss', err.message); }
  }
});

// plain-English answer for "why isn't this coin on my board?"
function whyHtml(mint, w) {
  const name = w.symbol ? `$${esc(w.symbol)}` : short(mint);
  const open = `<a class="btn" href="/pulse#coin=${esc(mint)}" onclick="document.getElementById('prefsModal').hidden=true">Open ${name} in SolBoy</a>`;
  if (!w.known) return `<div class="why bad"><b>SolBoy never received ${name}.</b> The live feed didn't deliver it (it may have launched while SolBoy was closed, or the feed dropped it). Opening it loads it now, and the 📡 Live data check below shows whether the feed is healthy.<div>${open}</div></div>`;
  const col = COLS[w.column];
  if (w.reasons.length) return `<div class="why"><b>${name} is in ${col}, but your filters hide it:</b><ul>${w.reasons.map((r) => `<li>${esc(r)}</li>`).join('')}</ul><div class="note">SolBoy doesn't know every number Axiom does for coins it didn't see launch; unknown numbers never hide a coin, but a known one can be different.</div><div>${open}</div></div>`;
  if (w.position < 0) return `<div class="why"><b>${name} is in ${col} and passes your filters,</b> but isn't in the newest 100 shown there.<div>${open}</div></div>`;
  return `<div class="why ok"><b>${name} is on your board: ${col}, #${w.position + 1}.</b>${w.migrated ? ` Marked as graduated by ${w.migratedBy === 'feed' ? 'the live feed (it saw the migration)' : w.migratedBy ?? 'a saved board'}.` : ''}${w.progress != null && !w.migrated ? ` Bonding curve ${pctf(w.progress)} (Final Stretch starts at ${CFG.stretchPct ?? 45}%: change it above if Axiom has it in another column).` : ''}<div>${open}</div></div>`;
}

/* ---------- routing ---------- */
let BLANK = null;
function route() {
  const m = /^#coin=([1-9A-HJ-NP-Za-km-z]{32,44})$/.exec(location.hash);
  if (m) { if (COIN?.mint !== m[1]) openCoin(m[1]); } else if (!$('coin').hidden || !es) { closeCoin(); }
}
addEventListener('hashchange', route);
addEventListener('keydown', (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if (!typing && !e.metaKey && !e.ctrlKey && !e.altKey) {
    if (e.key === '/' && !$('board').hidden) { e.preventDefault(); document.querySelector('[data-search="new"]')?.focus(); return; }
    if (e.key === 'q' || e.key === 'Q') { e.preventDefault(); $('quickBtn').click(); return; }
  }
  if (e.key === 'Escape' && typing) { document.activeElement.blur(); }
  if (e.key === 'Escape') { if (!$('filterModal').hidden) $('filterModal').hidden = true; else if (!$('prefsModal').hidden) $('prefsModal').hidden = true; else if (location.hash) location.hash = ''; }
});
(async function init() {
  const quickMint = new URLSearchParams(location.search).get('quick');
  try {
    const d = await api('/api/pulse/filters');
    FILTERS = d.filters; PROTOCOLS = d.protocols; CFG = { quickBuy: d.quickBuy, quickSell: d.quickSell, kols: d.kols, stretchPct: d.stretchPct ?? 45 };
    BLANK = clone(d.filters.presets[1].new); BLANK = blankLike(BLANK);
  } catch (err) { toast('loss', err.message); }
  markFilterButtons();
  if (quickMint !== null) {
    document.body.classList.add('quick-mode'); document.title = 'SolBoy quick trade';
    $('floating').hidden = false;
    if (quickMint) { setQuickMint(quickMint); stream(quickMint); } else renderFloating();
    return;
  }
  if (store.get('floatOpen', false)) { $('floating').hidden = false; renderFloating(); }
  route();
})();
// A clean copy of one column's filters, with every limit cleared and every launchpad allowed.
function blankLike(f) {
  const out = clone(f);
  out.include = []; out.exclude = [];
  for (const k of Object.keys(out.protocols)) out.protocols[k] = true;
  for (const group of ['audit', 'metrics', 'socials']) for (const [k, v] of Object.entries(out[group])) {
    if (typeof v === 'boolean') out[group][k] = false;
    else if (v && typeof v === 'object') for (const kk of Object.keys(v)) v[kk] = kk.endsWith('Unit') ? 'm' : '';
  }
  return out;
}
</script>
